name: Robin

on:
  pull_request:
    types: [opened, reopened, ready_for_review]
  issue_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: robin-${{ github.event.pull_request.number || github.event.issue.number }}
  cancel-in-progress: true

jobs:
  review:
    if: >-
      (
        github.event_name == 'pull_request' &&
        github.event.action == 'opened'
      ) || (
        github.event_name == 'issue_comment' &&
        github.event.issue.pull_request != null && (
          startsWith(github.event.comment.body, '/review') ||
          startsWith(github.event.comment.body, '/robin')
        ) && (
          github.event.comment.user.login == 'github-actions[bot]' ||
          contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR", "NONE"]'), github.event.comment.author_association)
        )
      )
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # zen 端点要求带 x-opencode-session；免费档不校验 session 真实性（实测随机/真实/缺失
      # 对 space-bunny-free 等价），故每次运行随机生成即可，避免把某个会话 id 硬编码进
      # 仓库后会话失效要改 workflow。生成式：ses_ + 6字节hex + 14位随机字母数字。
      - name: Generate LLM session id
        id: session
        run: |
          sid="ses_$(openssl rand -hex 6)$(LC_ALL=C tr -dc 'a-zA-Z0-9' < /dev/urandom | head -c 14)"
          echo "id=$sid" >> "$GITHUB_OUTPUT"
          echo "Generated session: $sid"

      - name: Robin review
        uses: Xiaobei09/robin-custom-headers@main
        with:
          github-token: ${{ github.token }}
          llm-api-key: ${{ secrets.LLM_API_KEY }}
          llm-base-url: ${{ secrets.LLM_BASE_URL }}
          model: ${{ secrets.LLM_MODEL }}
          custom-headers: '{"x-opencode-session":"${{ steps.session.outputs.id }}"}'
          config-file: .github/robin.yml
          review-instructions-file: .github/code-reviewer.md
          min-command-permission: none
