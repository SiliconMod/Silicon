name: Robin

on:
  pull_request:
    types: [opened, reopened, ready_for_review]
  issue_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: robin-${{ github.event.pull_request.number || github.event.issue.number }}
  cancel-in-progress: true

jobs:
  review:
    if: >-
      (
        github.event_name == 'pull_request' &&
        github.event.action == 'opened'
      ) || (
        github.event_name == 'issue_comment' &&
        github.event.issue.pull_request != null && (
          startsWith(github.event.comment.body, '/review') ||
          startsWith(github.event.comment.body, '/robin')
        ) && (
          github.event.comment.user.login == 'github-actions[bot]' ||
          contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR", "NONE"]'), github.event.comment.author_association)
        )
      )
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Robin review
        uses: Xiaobei09/robin-custom-headers@main
        with:
          github-token: ${{ github.token }}
          llm-api-key: ${{ secrets.LLM_API_KEY }}
          llm-base-url: ${{ secrets.LLM_BASE_URL }}
          model: ${{ secrets.LLM_MODEL }}
          custom-headers: '{"x-opencode-session":"ses_f1f1829d0ffepGs3895RABUUsJ"}'
          config-file: .github/robin.yml
          review-instructions-file: .github/code-reviewer.md
          min-command-permission: none
