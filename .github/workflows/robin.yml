name: Robin

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  issue_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: robin-${{ github.event.pull_request.number || github.event.issue.number }}
  cancel-in-progress: true

jobs:
  review:
    # ⚠️ 同仓 PR 与 fork PR 走的是**两条不同的凭据路径**，不要合并成一条：
    #   - 同仓 PR（本仓维护者的分支）：`pull_request` 事件，github.token 保留 pull-requests: write
    #     → 自动审查（下面 pull_request 那一支）。
    #   - fork PR：GitHub 对 fork 来源的 `pull_request` 运行**把 token 降级为只读**
    #     （实测：授权类报错 `Resource not accessible by integration`；对比同一次提交在
    #     `pull_request_target` 下零授权错误）。而 robin 必须建一条 review 评论，
    #     需要 pull-requests: write ⇒ 在 `pull_request` 下**必然 403**。
    #     所以这里显式把 fork PR 从自动路径排除，改由 issue_comment 的 `/review` 兜底：
    #     那种运行发生在 base 仓上下文，拿到的是可写 token，且本方案链路不依赖任何 secret。
    #     去掉下面那个 head.repo.full_name 判断，fork PR 就会红给维护者看。
    if: >-
      (
        github.event_name == 'pull_request' &&
        github.event.pull_request.draft == false &&
        github.event.pull_request.head.repo.full_name == github.repository
      ) || (
        github.event_name == 'issue_comment' &&
        github.event.issue.pull_request != null && (
          startsWith(github.event.comment.body, '/review') ||
          startsWith(github.event.comment.body, '/robin')
        ) && (
          github.event.comment.user.login == 'github-actions[bot]' ||
          contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association)
        )
      )
    runs-on: ubuntu-latest
    # 超时预算必须覆盖最坏路径，否则失败时连网关日志都来不及打：
    #   就绪探测上限 600s(10m) + 冒烟 240s(4m) + robin 3 次尝试 × llm-timeout 600s(30m) = 44m
    # 取 50 分钟留余量。实测正常路径仅 2-4 分钟。
    timeout-minutes: 50
    env:
      # 单一来源：就绪检查与 robin 的 model: 都读这个值，避免两处漂移
      MODEL: big-pickle
      GATEWAY_PORT: '8083'
      GATEWAY_URL: http://127.0.0.1:8083/v1
    steps:
      # ── 网关方案：让请求经由真实 opencode serve 进程上行 ──────────────────────
      # big-pickle 免费档有五道准入（stream / ≥2 tools / X-Session-ID / opencode UA / 来源），
      # GitHub runner 即便满足前四道仍恒 403。zengate 通过拉起真实的 opencode serve 子进程
      # 与 Zen 通信，不模拟客户端，因此绕开的是「来源」那一道而非任何配额/限流检查。
      # 网关自身鉴权用 ALLOW_NO_AUTH 关闭（只监听 127.0.0.1），故全链路无任何 API key。
      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install zengate
        run: |
          # 精确钉版本（不是 ^1 这种范围）。这条改动有实测依据：zengate 于 2026-09-27
          # 01:47 首发，当天 3 小时内连发 5 个版本（1.0.0→1.0.4），首日之后停更。
          # 范围写法（^1）意味着上游哪天发个 1.1.0 就会静默换掉本仓的网关行为，
          # 而 review 结论会随之漂移、事后极难归因。精确钉 = 换行为必须先改本文件、先进 PR。
          # 升级方式：先查 registry.npmjs.org/zengate 的 dist-tags.latest，改这一行，
          # 并在本注释里更新上面的实测依据。实际版本打进日志便于排查。
          ZENGATE_VERSION=1.0.4
          npm install -g "zengate@${ZENGATE_VERSION}"
          # zengate 自带 opencode-ai 依赖（package.json: "opencode-ai": "^1.18.32"），
          # 且 binary.js 的解析顺序是 OPENCODE_PATH → bundled 包 → PATH。
          # 因此这里**刻意不设 OPENCODE_PATH**——设了反而会屏蔽掉 zengate 自己锁定的那份依赖，
          # 把版本契约从 npm 的 semver 检查挪到"curl 装的 latest 恰好也是 1.x"这种巧合上。
          #
          # 回读确认装到的确实是钉住的那一版（registry 语义变化或静默回退时这道会失败）。
          # 判定必须走显式 [ ... ] + exit：上面这串管道的退出码取自末端的 cut（恒 0），
          # 只靠 `set -e` 管不到它——与本仓「curl -sf | head 恒 0」是同一个坑。
          got=$(npm ls -g zengate --depth=0 2>/dev/null | tail -1 | tr -s ' ' | sed -n 's/.*zengate@//p' | cut -d' ' -f1)
          echo "zengate requested=${ZENGATE_VERSION} installed=${got:-unknown}"
          [ "$got" = "$ZENGATE_VERSION" ] || { echo "::error::zengate version mismatch: wanted ${ZENGATE_VERSION}, got ${got:-unknown}"; exit 1; }
          echo "opencode bundled with zengate: $(npm ls -g opencode-ai --depth=0 2>/dev/null | tail -1 | tr -s ' ')"

      - name: Start zengate gateway
        env:
          ALLOW_NO_AUTH: 'true'
          HOST: 127.0.0.1
          PORT: ${{ env.GATEWAY_PORT }}
        run: |
          nohup zengate > /tmp/zengate.log 2>&1 &
          start=$SECONDS
          for i in $(seq 1 60); do
            if curl -sf -m 5 "http://127.0.0.1:${GATEWAY_PORT}/v1/models" > /tmp/models.json 2>/dev/null; then
              echo "Gateway ready after $((SECONDS - start))s"
              # OpenCode Zen 的免费模型目录会随时间变动（实测 2026-09-27 两天内就换过一批）。
              # 在这里显式校验目标模型仍在售，否则下游只会看到「冒烟没答 OK」这种误导性报错。
              if ! grep -q "\"id\":\"$MODEL\"" /tmp/models.json; then
                echo "::error::Model '$MODEL' is not in the gateway's current catalog."
                echo "Available: $(tr ',' '\n' < /tmp/models.json | grep -o '"id":"[^"]*"' | cut -d'"' -f4 | tr '\n' ' ')"
                echo "Zen rotates its free catalog; update 'model:' in this workflow to a currently listed id."
                exit 1
              fi
              head -c 400 /tmp/models.json
              echo
              exit 0
            fi
            sleep 10
          done
          echo "::error::Gateway did not become ready in 600s"
          cat /tmp/zengate.log
          exit 1

      - name: Smoke test gateway
        env:
          MODEL: ${{ env.MODEL }}
        run: |
          # 必须先落盘再判 HTTP 码：直接 `curl -sf | head -c N` 在 bash -e 下退出码取自
          # 管道末端的 head（恒 0），网关返 4xx/5xx 时这道冒烟闸门依然会「通过」。
          # model 取自 $MODEL（与 robin 同一来源），不要在此硬编码，否则改了 MODEL
          # 之后冒烟会去打另一个模型并报出误导性的「did not answer OK」。
          body=$(printf '{"model":"%s","messages":[{"role":"user","content":"Reply with exactly: OK"}]}' "$MODEL")
          code=$(curl -s -m 240 -o /tmp/smoke.json -w '%{http_code}' \
            -X POST "$GATEWAY_URL/chat/completions" \
            -H "Content-Type: application/json" \
            -d "$body")
          echo "smoke HTTP=$code (model=$MODEL)"
          head -c 300 /tmp/smoke.json; echo
          [ "$code" = 200 ] || { echo "::error::Gateway smoke test failed (HTTP $code)"; exit 1; }
          grep -q '"content":"OK"' /tmp/smoke.json \
            || { echo "::error::$MODEL did not answer OK through the gateway"; exit 1; }

      - name: Robin review
        uses: antongulin/robin@v2.7.2
        with:
          # github.token 是 GitHub 自动注入的、每次运行自动轮换的内建凭据，**不是 secret**，
          # 所以「拿得到」这一点对 fork PR 同样成立（pull_request 不注入 secrets.* 这条限制
          # 与它无关）。整条链路无 secret 依赖，故不需要 GH_PAT，也不需要原先那道
          # 「配置不可见就跳过」的守卫。
          #
          # ⚠️ 但「拿得到」≠「有写权限」，这正是本注释此前写错的地方：
          #   fork 来源的 `pull_request` 运行里，GitHub 会把这个 token **降级为只读**，
          #   而 robin 要发一条 review 评论（需要 pull-requests: write）⇒ 403。
          #   实测对照见上：同仓 PR 自动审查正常，fork PR 走 /review 评论路径才通。
          #   因此**不要**在这里开「Send write tokens to workflows from pull requests」来
          #   试图让 fork PR 获得写权限——该开关只影响同仓 PR，而为它放宽的却是对
          #   pull_request 运行的整体信任面；且公共 fork 无论开关如何都是只读。
          #   本方案的取舍：自动审查只覆盖同仓 PR，fork PR 走 issue_comment 的 /review。
          github-token: ${{ github.token }}
          # 网关关闭了鉴权，此处仅占位；Robin 要求 apiKey 非空（空值会被兜底成 "ollama"）。
          llm-api-key: public
          llm-base-url: ${{ env.GATEWAY_URL }}
          model: ${{ env.MODEL }}
          # 关键：关闭 JSON 响应模式。原因见 review-retry.ts 的 shouldRetryStructuredReview：
          # 它的空审查重试保护写着 `if (usedJson) return false`，即 JSON 模式下一次都不会重试。
          # 经 zengate 网关实测 big-pickle 偶发返回字面量 `{}`（5.2s、reasoning 为空），
          # 那会被当成「0 条发现」直接发出 "Nothing worth flagging" —— 对审查闸门是最坏的假通过。
          # 关掉后重试保护重新生效，且实测模型更快、发现更多（43.9s/18 条 vs 241s/6 条）。
          use-json-response-mode: false
          config-file: .github/robin.yml
          review-instructions-file: .github/code-reviewer.md
          min-command-permission: triage
          review-on-synchronize: true

      - name: Gateway log
        if: always()
        run: tail -40 /tmp/zengate.log 2>&1 || true
