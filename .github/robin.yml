skip-paths:
  - "assets/sprites/**"
  - "assets/icons/**"
  - "assets/maps/**"
  - "*.jar"
  - "gradle/**"
  - ".gradle/**"
  - "build/**"
  - "docs/**"
  - "tests/**"
  - "scripts/**"

# 顾问模式：高严重度发现只发非阻塞 COMMENT，不自动 REQUEST_CHANGES 卡 PR，
# 减少误报对合并的阻塞影响（真实阻塞交由人类维护者判断）。
request-changes: false

# 收敛单次行内评论数量：卫星等大 PR 需更多上下文，8 条易截断有效发现 → 放宽至 12
max-comments: 12

# 大 PR（如卫星 170k diff）按 30k 截断会丢 80% 上下文，反而加剧臆断；放宽至 80k 保留核心变更
max-diff-size: 80000

