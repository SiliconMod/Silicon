skip-paths:
  - "assets/sprites/**"
  - "assets/icons/**"
  - "assets/maps/**"
  - "*.jar"
  - "gradle/**"
  - ".gradle/**"
  - "build/**"
  # 以下三条是**刻意**排除，不是配置疏漏（2026-09-27 核实）：
  # - docs/blocks 写的是行为规格与版本历史，Robin 审 Java/Mindustry 规则，
  #   审 Markdown 只会产噪音；PR #17 改了 2 个 docs 文件逃过审查，属预期。
  # - scripts/hub-deep-check.ps1 是 AGENTS.md 定义的强制验证脚本（锚点校验+构建+双目录部署），
  #   确实是提交物，但它是 PowerShell 而非 Java，让弱模型审 PS1 几乎必然全是误报
  #   （误报红线的成因之一），收益为负。锚点正确性靠脚本自身 BUILD FAIL 兜底，不靠 LLM。
  # 若将来要审 PowerShell，应为该语言单独写审查规则，而不是把它塞进 Java 规则里。
  - "docs/**"
  - "tests/**"
  - "scripts/**"

# 顾问模式：高严重度发现只发非阻塞 COMMENT，不自动 REQUEST_CHANGES 卡 PR，
# 减少误报对合并的阻塞影响（真实阻塞交由人类维护者判断）。
request-changes: false

# 收敛单次行内评论数量：卫星等大 PR 需更多上下文，8 条易截断有效发现 → 放宽至 12
max-comments: 12

# 大 PR 截断上限。**单位是 diff 文本的字符数，且必须用 API 响应的原始字节数**
# （`len(gh api ... .diff)` 的 stdout 原样长度）。用 shell `$(...)` 量会剥掉尾部换行、
# 每个 PR 少 1–3 字符；同一段注释里混两种口径就会自相矛盾，2026-09-28 修的就是这个。
# 本文件每个数都有 `check-robin-yml.py` 从 API 逐个复算，改数字必须连着改到过闸。（2026-09-28 实测复核，逐条修正本文件上一版的错账）。
# 本文件上一版写「旧注释『卫星 170k diff』是按行数记的，真实字符数是它的 2–3 倍」——实测站不住：
# 那批 PR 的字符/行比是 45–58 倍，不是 2–3 倍；且全仓最大 diff 只有 9083 行，不存在 170k 行的 PR。
# 该推断已删除，不留作"依据"。
#
# 数据必须标清仓名。上一版把 fork 的数当成本仓的数写，而本仓 #16/#17 根本不存在（REST 返回 404）：
#   本仓 SiliconMod/Silicon：#10=130167、#36=55443、#68=91685、#15=46736、#3=30101
#   fork Xiaobei09/Silicon：#16=501252、#10=307805、#15=302371、#17=292127、#3=125601
# 上一版列的 125601/307805/302371/501252/292127 与 fork 五个数逐字吻合
# ⇒ 数是实测真值，**归属标错了仓**（这已是本项目第四次栽在 fork/本仓混用上）。
#
# 80000 的实际影响（按本仓算，本仓才是本文件生效的仓）：
#   本仓现有**两个** PR 超过 80000：#10（130167）只保留 61.5%，#68（91685）只保留 87.3%。
#   截断是 head-only（slice(0,N)）⇒ 靠后文件整块消失，模型会把残缺 diff 当完整 diff 审 → 臆断。
#   其余本仓 PR（#36 55443、#15 46736、#3 30101）均 100% 保留。
#   #68 的增长来自本 PR 自身的新增提交，不是上游动了 diff：逐 head 实测
#   ed9631b=78552 → f9b54ed=79740 → fa06a76=82368（**首次越线**）→ e74b596=91180 → fd88ebb=91685。
#   越线主要来自 e74b596（review_from_diff.py 的坏 finding 处理 +91 行，及其长条目），
#   属预期 —— 那些提交确实往 PR 里加了内容。原注释的 54798 是更早 head 上的旧值，
#   未随 diff 增长更新，本轮由 check-robin-yml.py 逐字复算时抓出。
#   当前影响面：#68 的 Robin job 在 fork PR 上是 skipped，故无人被截断；
#   但 `/review`、`/robin` 评论那条支路跑在 base 仓上下文、token 可写，**会真的截断 #68**。
#   上一版「仅剩 16%–32%」是拿 fork 的数算的，真值 16.0%–27.4%，上界高了 4.6 个百分点。
#   上一版「调到 200000 可覆盖 #17/#10/#15」在它自己列的数上就不成立：三个都 >200000，
#   分别还缺 92127 / 107805 / 102371 字符。
#
# 200000 对【本仓】是够的：可 100% 覆盖上表全部本仓 PR，对最大者 #10 留约 1.5 倍余量。
# 但改这个值是行为变更、不在本次评审点范围内，故这里只给实测数据与建议，**值仍保持 80000**，
# 是否上调由维护者定。改时注意：工作流里绝不能显式传 max-diff-size，
# 否则会架空这里的配置（见 AGENTS.md 已知坑「resolveMaxDiffSize 优先级」）。
max-diff-size: 80000

