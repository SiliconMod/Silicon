skip-paths:
  - "assets/sprites/**"
  - "assets/icons/**"
  - "assets/maps/**"
  - "*.jar"
  - "gradle/**"
  - ".gradle/**"
  - "build/**"
  # 以下三条是**刻意**排除，不是配置疏漏（2026-09-27 核实）：
  # - docs/blocks 写的是行为规格与版本历史，Robin 审 Java/Mindustry 规则，
  #   审 Markdown 只会产噪音；PR #17 改了 2 个 docs 文件逃过审查，属预期。
  # - scripts/hub-deep-check.ps1 是 AGENTS.md 定义的强制验证脚本（锚点校验+构建+双目录部署），
  #   确实是提交物，但它是 PowerShell 而非 Java，让弱模型审 PS1 几乎必然全是误报
  #   （误报红线的成因之一），收益为负。锚点正确性靠脚本自身 BUILD FAIL 兜底，不靠 LLM。
  # 若将来要审 PowerShell，应为该语言单独写审查规则，而不是把它塞进 Java 规则里。
  - "docs/**"
  - "tests/**"
  - "scripts/**"

# 顾问模式：高严重度发现只发非阻塞 COMMENT，不自动 REQUEST_CHANGES 卡 PR，
# 减少误报对合并的阻塞影响（真实阻塞交由人类维护者判断）。
request-changes: false

# 收敛单次行内评论数量：卫星等大 PR 需更多上下文，8 条易截断有效发现 → 放宽至 12
max-comments: 12

# 大 PR 截断上限。**校准基准是 diff 字符数，不是行数**（2026-09-27 实测修正：
# 本文件旧注释写「卫星 170k diff」是按行数记的，真实字符数是它的 2–3 倍）。
# Silicon 真实 PR 字符数：#16=501252、#10=307805、#15=302371、#17=292127、#3=125601。
# 80000 只能覆盖 #3 级别；上述 4 个大 PR 仅剩 16%–32% 内容，且截断是 head-only
# （slice(0,N)，靠后文件整块消失），模型会把残缺 diff 当完整 diff 审 → 臆断。
# 调到 200000 可覆盖 #17/#10/#15；#16 仍超。真要完整审超大重构须分片多轮，
# 单纯调大只会让长上下文稀释注意力。注意：工作流里绝不能显式传 max-diff-size，
# 否则会架空这里的配置（见 AGENTS.md 已知坑「resolveMaxDiffSize 优先级」）。
max-diff-size: 80000

