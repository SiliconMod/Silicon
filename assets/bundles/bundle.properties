block.silicon-dimension-anchor.description=A 3x3 dimension anchor that can store 100 items. Click to set a mode and signal: send mode must charge for 10 seconds with power (1200/s), then sends its whole inventory as a package to the receiving anchor with the same signal; receive mode uses 160/s power and receives items from sending anchors with the same signal. Only one receiving anchor is allowed per signal.
